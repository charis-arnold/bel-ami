<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="Bel-Ami — Topografie der Gefühle">
  <title>Bel-Ami — Topografie der Gefühle</title>
  <!-- Das Zeichen der Kreisgrafik: zwei Valenzhälften, durch einen Spalt
       getrennt. Obere Hälfte auf vollem Radius (positiv), untere kleiner
       (negativ) — dieselben Proportionen wie leisteValenz() in
       js/kreisgrafik.js: r_unten = 0.72 * r_oben, Spalt = 8/28 * r_oben.
       Der Spalt ist zwingend: ohne ihn verschmelzen die Hälften zu einer
       Form und lesen sich nicht mehr als Halbkreise.
       Gold = KREIS_KATEGORIEN[0] (Raum und Umwelt), Orange = FWERT_COLOR. -->
  <path d="M 4.5 15.97 A 11.5 11.5 0 0 1 27.5 15.97 Z" fill="#C6A22B"/>
  <path d="M 7.72 19.25 A 8.28 8.28 0 0 0 24.28 19.25 Z" fill="#C6A22B"/>
  <circle cx="26.6" cy="5.36" r="2.8" fill="#C2511C"/>
</svg>
